name: Release

on:
  workflow_dispatch:
    inputs:
      minecraft_versions:
        description: minecraft versions to publish (csv or spaces). leave blank to publish every version.
        required: false
        type: string
      dry_run:
        description: Build without uploading
        default: false
        type: boolean
      publish_curseforge:
        description: Publish to CurseForge
        default: true
        type: boolean
      publish_modrinth:
        description: Publish to Modrinth
        default: true
        type: boolean
      publish_github:
        description: Publish to GitHub Releases
        default: true
        type: boolean
      release_type:
        description: Release channel
        default: STABLE
        type: choice
        options: [STABLE, BETA, ALPHA]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    env:
      PUBLISH_VERSIONS: ${{ inputs.minecraft_versions }}
      DRY_RUN: ${{ inputs.dry_run }}
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate release inputs
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_CURSEFORGE: ${{ inputs.publish_curseforge }}
          PUBLISH_MODRINTH: ${{ inputs.publish_modrinth }}
          PUBLISH_GITHUB: ${{ inputs.publish_github }}
        run: |
          test -s CHANGELOG.md

          if [[ "${DRY_RUN}" != "true" && "${PUBLISH_CURSEFORGE}" == "true" ]]; then
            : "${CURSEFORGE_API_KEY:?CURSEFORGE_API_KEY is not configured}"
            curl --fail --silent --show-error \
              --header "x-api-token: ${CURSEFORGE_API_KEY}" \
              https://minecraft.curseforge.com/api/game/version-types > /dev/null
          fi

          if [[ "${DRY_RUN}" != "true" && "${PUBLISH_MODRINTH}" == "true" ]]; then
            : "${MODRINTH_TOKEN:?MODRINTH_TOKEN is not configured}"
            curl --fail --silent --show-error \
              --header "Authorization: ${MODRINTH_TOKEN}" \
              --header "User-Agent: ${GITHUB_REPOSITORY} GitHub Actions" \
              https://api.modrinth.com/v2/user > /dev/null
          fi

          if [[ "${DRY_RUN}" != "true" && "${PUBLISH_GITHUB}" == "true" ]]; then
            : "${GITHUB_TOKEN:?GITHUB_TOKEN is not configured}"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}" > /dev/null
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build all versions
        run: ./gradlew buildAll --console plain

      - name: Publish GitHub release
        if: ${{ inputs.publish_github }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGELOG="$(cat CHANGELOG.md)" ./gradlew publishMods \
            -PpublishDryRun="$DRY_RUN" -PreleaseType="$RELEASE_TYPE" \
            -PpublishCurseForge=false \
            -PpublishModrinth=false \
            -PpublishGitHub=true \
            --no-parallel \
            --console plain

      - name: Publish CurseForge files
        if: ${{ inputs.publish_curseforge }}
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          CHANGELOG="$(cat CHANGELOG.md)" ./gradlew publishMods \
            -PpublishDryRun="$DRY_RUN" -PreleaseType="$RELEASE_TYPE" \
            -PpublishCurseForge=true \
            -PpublishModrinth=false \
            -PpublishGitHub=false \
            --no-parallel \
            --console plain

      - name: Publish Modrinth files
        if: ${{ inputs.publish_modrinth }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          CHANGELOG="$(cat CHANGELOG.md)" ./gradlew publishMods \
            -PpublishDryRun="$DRY_RUN" -PreleaseType="$RELEASE_TYPE" \
            -PpublishCurseForge=false \
            -PpublishModrinth=true \
            -PpublishGitHub=false \
            --no-parallel \
            --console plain
